<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ 創客課堂：紙電路實作學習單</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, "Microsoft JhengHei";
            background-color: #f0f4f8;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }
        h2 {
            color: #1a5f7a;
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #1a5f7a;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #2c3e50;
        }
        input[type="text"], select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 5px;
        }
        .radio-option {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        button {
            width: 100%;
            background-color: #1a5f7a;
            color: white;
            border: none;
            padding: 12px;
            font-size: 18px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #124559;
        }
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        #message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            display: none;
        }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="container">
    <h2>⚡ 紙電路實作學習單</h2>
    
    <form id="quizForm">
        <div class="form-group">
            <label for="classNum">1. 班級座號 (例如: 50123)</label>
            <input type="text" id="classNum" placeholder="請輸入五碼班級座號" required>
        </div>

        <div class="form-group">
            <label for="studentName">2. 學生姓名</label>
            <input type="text" id="studentName" placeholder="請填寫你的名字" required>
        </div>

        <div class="form-group">
            <label for="ledColor">3. 你使用的 LED 燈顏色</label>
            <select id="ledColor" required>
                <option value="">-- 請選擇 --</option>
                <option value="紅色">🔴 紅色</option>
                <option value="黃色">🟡 黃色</option>
                <option value="藍色">🔵 藍色</option>
                <option value="綠色">🟢 綠色</option>
                <option value="彩色閃爍">✨ 彩色閃爍</option>
            </select>
        </div>

        <div class="form-group">
            <label>4. 你的紙電路是否有成功發光？</label>
            <div class="radio-group">
                <label class="radio-option">
                    <input type="radio" name="isSuccess" value="是" required> 🎉 有，成功發光！
                </label>
                <label class="radio-option">
                    <input type="radio" name="isSuccess" value="否"> ❌ 沒有，再接再厲！
                </label>
            </div>
        </div>

        <div class="form-group">
            <label for="reflection">5. 遇到的困難與心得反思</label>
            <textarea id="reflection" placeholder="例如：貼銅箔時折角斷掉、正負極接反，後來是怎麼解決的呢？" required></textarea>
        </div>

        <button type="submit" id="submitBtn">🚀 送出學習單</button>
    </form>

    <div id="message"></div>
</div>

<script>
    // ⚠️ 步驟 2：請將下方單引號內的網址，替換成您部署 GAS 後獲得的「網頁應用程式網址」
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbz_XXXXXXXXXXXXXX/exec';

    document.getElementById('quizForm').addEventListener('submit', function(e) {
        e.preventDefault(); // 阻止表單預設跳頁行為
        
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');
        
        // 變更按鈕狀態為傳送中
        submitBtn.disabled = true;
        submitBtn.innerText = ' 傳送中，請稍候...';
        
        // 隱藏之前的訊息
        messageDiv.style.display = 'none';
        messageDiv.className = '';

        // 收集表單資料
        const formData = new URLSearchParams();
        formData.append('classNum', document.getElementById('classNum').value);
        formData.append('studentName', document.getElementById('studentName').value);
        formData.append('ledColor', document.getElementById('ledColor').value);
        formData.append('isSuccess', document.querySelector('input[name="isSuccess"]:checked').value);
        formData.append('reflection', document.getElementById('reflection').value);

        // 使用 fetch 發送 POST 請求到 GAS
        fetch(GAS_URL, {
            method: 'POST',
            body: formData,
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            }
        })
        .then(response => response.json())
        .then(data => {
            if(data.result === 'success') {
                messageDiv.innerText = '🎉 太棒了！你的學習單已成功送出！';
                messageDiv.className = 'success';
                messageDiv.style.display = 'block';
                document.getElementById('quizForm').reset(); // 清空表單
            } else {
                throw new Error(data.message || '儲存失敗');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            messageDiv.innerText = '❌ 送出失敗，請檢查網路或通知老師！';
            messageDiv.className = 'error';
            messageDiv.style.display = 'block';
        })
        .finally(() => {
            // 恢復按鈕狀態
            submitBtn.disabled = false;
            submitBtn.innerText = '🚀 送出學習單';
        });
    });
</script>

</body>
</html>
