<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游泳技術實作自動化學習單</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background-color: #f0f8ff;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #ffffff;
            max-width: 600px;
            width: 100%;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            color: #0066cc;
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #0066cc;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #004488;
        }
        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        input[type="text"]:focus, select:focus, textarea:focus {
            border-color: #0066cc;
            outline: none;
            box-shadow: 0 0 5px rgba(0,102,204,0.3);
        }
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 5px;
        }
        .radio-option {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 16px;
        }
        button {
            width: 100%;
            background-color: #0066cc;
            color: white;
            border: none;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #004488;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        #message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            display: none;
        }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏊‍♂️ 游泳技術實作學習單</h2>
    
    <form id="quizForm">
        <div class="form-group">
            <label for="className">選擇班級：</label>
            <select id="className" required>
                <option value="" disabled selected>-- 請選擇你的班級 --</option>
                <option value="高一1班">高一1班</option>
                <option value="高一2班">高一2班</option>
                <option value="高一3班">高一3班</option>
                <option value="高一4班">高一4班</option>
            </select>
        </div>

        <div class="form-group">
            <label for="seatNumber">座號：</label>
            <input type="number" id="seatNumber" min="1" max="50" placeholder="例如：05" required>
        </div>

        <div class="form-group">
            <label for="studentName">學生姓名：</label>
            <input type="text" id="studentName" placeholder="請輸入完整姓名" required>
        </div>

        <div class="form-group">
            <label for="swimStyle">本次練習泳姿：</label>
            <select id="swimStyle" required>
                <option value="" disabled selected>-- 請選擇泳姿 --</option>
                <option value="捷泳 (自由式)">捷泳 (自由式)</option>
                <option value="蛙泳">蛙泳</option>
                <option value="仰泳">仰泳</option>
                <option value="蝶泳">蝶泳</option>
            </select>
        </div>

        <div class="form-group">
            <label>50公尺達標狀況：</label>
            <div class="radio-group">
                <label class="radio-option"><input type="radio" name="target50m" value="能游完 50 公尺" required> 能游完 50 公尺</label>
                <label class="radio-option"><input type="radio" name="target50m" value="未能游完 50 公尺"> 未能游完 50 公尺</label>
            </div>
        </div>

        <div class="form-group">
            <label for="reflection">實作困難與自我反思：</label>
            <textarea id="reflection" rows="4" placeholder="請寫下今天練習遇到的困難、姿勢調整或心得..." required></textarea>
        </div>

        <button type="submit" id="submitBtn">🚀 送出學習單</button>
    </form>

    <div id="message"></div>
</div>

<script>
    // 已自動幫您替換為最新生成的有效 GAS 網址
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwTtDaMycG1S3wDDVUhCBC11WxHFiGA33BzUkr8DhtKM8X7eRpmop8-bFxqaZPQEdY/exec';

    document.getElementById('quizForm').addEventListener('submit', function(e) {
        e.preventDefault(); // 防止頁面跳轉
        
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');
        
        // 進入傳送狀態，鎖定按鈕
        submitBtn.disabled = true;
        submitBtn.innerText = '⏳ 正在傳送資料...';
        messageDiv.style.display = 'none';

        // 統整表單資料
        const formData = {
            className: document.getElementById('className').value,
            seatNumber: document.getElementById('seatNumber').value,
            studentName: document.getElementById('studentName').value,
            swimStyle: document.getElementById('swimStyle').value,
            target50m: document.querySelector('input[name="target50m"]:checked').value,
            reflection: document.getElementById('reflection').value
        };

        // 使用 fetch 將資料以 POST 送往您的 GAS
        fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify(formData),
            headers: {
                'Content-Type': 'text/plain' // 使用 text/plain 繞過跨網域預檢
            },
            mode: 'no-cors' // 採用 no-cors 模式確保通訊順暢
        })
        .then(() => {
            // 資料成功送出後的提示
            messageDiv.className = 'success';
            messageDiv.innerHTML = `🎉 太棒了！你的學習單已成功送出到【${formData.className}】紀錄中！`;
            messageDiv.style.display = 'block';
            
            // 恢復按鈕，並清空個人填寫欄位（保留班級方便下一位學生繼續填寫）
            submitBtn.disabled = false;
            submitBtn.innerText = '🚀 送出學習單';
            document.getElementById('seatNumber').value = '';
            document.getElementById('studentName').value = '';
            document.getElementById('reflection').value = '';
            const checkedRadio = document.querySelector('input[name="target50m"]:checked');
            if(checkedRadio) checkedRadio.checked = false;
        })
        .catch(error => {
            messageDiv.className = 'error';
            messageDiv.innerText = '❌ 發生錯誤，請檢查網路連線或通知老師！';
            messageDiv.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.innerText = '🚀 送出學習單';
            console.error('Error:', error);
        });
    });
</script>

</body>
</html>
